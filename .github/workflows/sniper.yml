name: Kufar Sniper 3.9

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kufar-sniper-v3-singleton
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Восстановление базы из GitHub Release
        id: restore-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download db-state -R "${{ github.repository }}" -p "sniper.db" --clobber || true
          gh release download db-state -R "${{ github.repository }}" -p "settings.json" --clobber || true
          if [ -f sniper.db ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Фоллбэк из старого кэша (только при первом запуске)
        if: steps.restore-release.outputs.found != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            sniper.db
            sniper.db-wal
            sniper.db-shm
            settings.json
          key: sniper-v3-db-${{ github.run_id }}
          restore-keys: |
            sniper-v3-db-

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка библиотек
        run: pip install requests rapidfuzz

      - name: Запуск Kufar Sniper
        id: run-sniper
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MAX_RUN_HOURS: '5.8'
        run: python -u sniper.py

      - name: Сохранение базы в GitHub Release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -c "import os, sqlite3; c = sqlite3.connect('sniper.db') if os.path.exists('sniper.db') else None; c and (c.execute('PRAGMA wal_checkpoint(TRUNCATE)'), c.commit(), c.close())"
          gh release view db-state -R "${{ github.repository }}" >/dev/null 2>&1 || gh release create db-state -R "${{ github.repository }}" --title "Sniper DB State" --notes "Auto-saved SQLite DB and settings"
          if [ -f sniper.db ]; then
            gh release upload db-state sniper.db -R "${{ github.repository }}" --clobber
          fi
          if [ -f settings.json ]; then
            gh release upload db-state settings.json -R "${{ github.repository }}" --clobber
          fi

      - name: Автоперезапуск следующей смены без пауз
        if: steps.run-sniper.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
