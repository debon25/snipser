name: Kufar Sniper 3.9

on:
  schedule:
    - cron: '0 */12 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: kufar-sniper-v3-singleton
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Восстановление и проверка базы из GitHub Release
        id: restore-release
        env:
          GH_TOKEN: ${{ secrets.DB_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          DB_REPO: ${{ vars.DB_REPO || github.repository }}
        run: |
          python - << 'PYEOF'
          import json, os, sqlite3, subprocess, sys, time, urllib.request, urllib.error

          token = os.environ["GH_TOKEN"]
          repo = os.environ["DB_REPO"]
          gh_out = os.environ["GITHUB_OUTPUT"]

          def write_out(k, v):
              with open(gh_out, "a", encoding="utf-8") as f:
                  f.write(f"{k}={v}\n")

          def fetch_release():
              url = f"https://api.github.com/repos/{repo}/releases/tags/db-state"
              req = urllib.request.Request(url, headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "User-Agent": "kufar-sniper-actions"
              })
              for attempt in range(3):
                  try:
                      with urllib.request.urlopen(req, timeout=15) as r:
                          return 200, json.loads(r.read().decode("utf-8"))
                  except urllib.error.HTTPError as e:
                      if e.code == 404:
                          return 404, None
                      print(f"API HTTP {e.code} (попытка {attempt+1}/3)")
                  except Exception as e:
                      print(f"Сетевая ошибка API: {e} (попытка {attempt+1}/3)")
                  time.sleep(3 * (attempt + 1))
              return 0, None

          def download_asset(pattern):
              for attempt in range(3):
                  res = subprocess.run(
                      ["gh", "release", "download", "db-state", "-R", repo, "-p", pattern, "--clobber"],
                      capture_output=True, text=True
                  )
                  if res.returncode == 0:
                      return True
                  print(f"Ошибка скачивания {pattern} (попытка {attempt+1}/3): {res.stderr.strip()}")
                  time.sleep(3 * (attempt + 1))
              return False

          code, rel = fetch_release()
          if code == 0:
              print("FATAL: Не удалось связаться с GitHub Releases. Запуск прерван, чтобы не затереть БД.")
              sys.exit(1)

          if code == 404:
              print("Релиз db-state не найден (первый запуск).")
              write_out("found", "false")
              write_out("restore_ok", "true")
              write_out("init_size", "0")
              write_out("init_rows", "0")
              sys.exit(0)

          assets = {a["name"]: a.get("size", 0) for a in rel.get("assets", [])}

          if "settings.json" in assets:
              if not download_asset("settings.json"):
                  print("FATAL: settings.json есть в релизе, но не скачался.")
                  sys.exit(1)
              with open("settings.json", "r", encoding="utf-8") as f:
                  json.load(f)

          if "sniper.db" not in assets or assets["sniper.db"] == 0:
              print("В релизе db-state нет непустого sniper.db.")
              write_out("found", "false")
              write_out("restore_ok", "true")
              write_out("init_size", "0")
              write_out("init_rows", "0")
              sys.exit(0)

          remote_size = assets["sniper.db"]
          if not download_asset("sniper.db") or not os.path.exists("sniper.db"):
              print("FATAL: sniper.db есть в релизе, но скачивание упало.")
              sys.exit(1)

          local_size = os.path.getsize("sniper.db")
          if local_size != remote_size:
              print(f"FATAL: Размер скачанного sniper.db ({local_size}) != размеру в релизе ({remote_size}).")
              sys.exit(1)

          conn = sqlite3.connect("sniper.db")
          chk = conn.execute("PRAGMA integrity_check;").fetchone()
          if not chk or chk[0] != "ok":
              print(f"FATAL: Поврежденная БД после скачивания: {chk}")
              sys.exit(1)

          init_rows = 0
          for tbl in ("lot_history", "ml_ads"):
              try:
                  init_rows += conn.execute(f"SELECT COUNT(*) FROM {tbl}").fetchone()[0]
              except Exception:
                  pass
          conn.close()

          print(f"OK: sniper.db восстановлен ({local_size} байт, строк={init_rows}).")
          write_out("found", "true")
          write_out("restore_ok", "true")
          write_out("init_size", str(local_size))
          write_out("init_rows", str(init_rows))
          PYEOF

      - name: Фоллбэк из старого кэша (только если в релизе еще нет БД)
        if: steps.restore-release.outputs.found != 'true' && steps.restore-release.outputs.restore_ok == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            sniper.db
            sniper.db-wal
            sniper.db-shm
            settings.json
          key: sniper-v3-db-${{ github.run_id }}
          restore-keys: |
            sniper-v3-db-

      - name: Установка библиотек
        run: pip install requests rapidfuzz

      - name: Запуск Kufar Sniper
        id: run-sniper
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MAX_RUN_HOURS: '5.5'
          DB_REPO: ${{ vars.DB_REPO || github.repository }}
        run: python -u sniper.py

      - name: Безопасное сохранение базы в GitHub Release
        if: always() && steps.restore-release.outputs.restore_ok == 'true'
        env:
          GH_TOKEN: ${{ secrets.DB_REPO_TOKEN || secrets.GITHUB_TOKEN }}
          DB_REPO: ${{ vars.DB_REPO || github.repository }}
          INIT_SIZE: ${{ steps.restore-release.outputs.init_size }}
          INIT_ROWS: ${{ steps.restore-release.outputs.init_rows }}
        run: |
          python - << 'PYEOF'
          import json, os, sqlite3, subprocess, sys, time

          repo = os.environ["DB_REPO"]
          init_size = int(os.environ.get("INIT_SIZE") or 0)
          init_rows = int(os.environ.get("INIT_ROWS") or 0)

          if not os.path.exists("sniper.db"):
              print("BLOCKED: sniper.db отсутствует, выгрузка отменена.")
              sys.exit(1)

          conn = sqlite3.connect("sniper.db")
          conn.execute("PRAGMA wal_checkpoint(TRUNCATE);")
          conn.execute("PRAGMA journal_mode=DELETE;")
          conn.commit()
          chk = conn.execute("PRAGMA integrity_check;").fetchone()
          if not chk or chk[0] != "ok":
              print(f"BLOCKED: integrity_check не пройден ({chk}), выгрузка отменена.")
              sys.exit(1)

          final_rows = 0
          for tbl in ("lot_history", "ml_ads"):
              try:
                  final_rows += conn.execute(f"SELECT COUNT(*) FROM {tbl}").fetchone()[0]
              except Exception:
                  pass
          conn.close()

          final_size = os.path.getsize("sniper.db")
          print(f"Проверка БД перед выгрузкой: размер {init_size} -> {final_size} байт | строк {init_rows} -> {final_rows}")

          if final_size == 0 or final_size < init_size or final_rows < init_rows:
              print("BLOCKED: Итоговая БД меньше исходной или потеряла строки. Перезапись релиза отменена!")
              sys.exit(1)

          view = subprocess.run(["gh", "release", "view", "db-state", "-R", repo], capture_output=True)
          if view.returncode != 0:
              subprocess.run(
                  ["gh", "release", "create", "db-state", "-R", repo, "--title", "Sniper DB State", "--notes", "Auto-saved SQLite DB and settings"],
                  check=True
              )

          def upload_with_retry(path):
              for attempt in range(3):
                  res = subprocess.run(
                      ["gh", "release", "upload", "db-state", path, "-R", repo, "--clobber"],
                      capture_output=True, text=True
                  )
                  if res.returncode == 0:
                      return
                  print(f"Ошибка выгрузки {path} (попытка {attempt+1}/3): {res.stderr.strip()}")
                  time.sleep(3 * (attempt + 1))
              sys.exit(1)

          upload_with_retry("sniper.db")
          if os.path.exists("settings.json"):
              try:
                  with open("settings.json", "r", encoding="utf-8") as f:
                      json.load(f)
                  upload_with_retry("settings.json")
              except Exception as e:
                  print(f"settings.json поврежден ({e}), пропускаю его выгрузку.")
          print("OK: База безопасно сохранена в релиз db-state.")
          PYEOF

      - name: Автоперезапуск следующей смены без пауз
        if: steps.run-sniper.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
