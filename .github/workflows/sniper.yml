name: Kufar Sniper 4.0 (shifts, optional)

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      run_minutes:
        description: 'Shift duration: 5/10 minutes for validation, 318 for continuous collection'
        type: choice
        options: ['318', '5', '10']
        default: '318'
      continue_chain:
        description: 'Start the next shift after a verified save'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: kufar-sniper-v3-singleton
  cancel-in-progress: false

jobs:
  run-bot:
    # Enable only when Actions is the selected host. Never run with the VPS bot.
    if: vars.SNIPER_ACTIONS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      DB_FILE: sniper.db
      SETTINGS_FILE: settings.json
      DB_REPO: ${{ vars.DB_REPO || github.repository }}
      PYTHONUTF8: '1'
      SNIPER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Restore committed snapshot (missing state is fatal)
        id: restore
        env:
          GH_TOKEN: ${{ secrets.DB_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python state_store.py restore-release --baseline state/restore-baseline.db
      - name: Record that this shift must save before the next one can start
        id: lease
        env:
          GH_TOKEN: ${{ secrets.DB_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python state_store.py begin-run
      - name: Run one shift with singleton lock
        id: bot
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MAX_RUN_HOURS: ${{ inputs.run_minutes == '5' && '0.0833333333' || inputs.run_minutes == '10' && '0.1666666667' || '5.3' }}
        run: timeout --signal=TERM --kill-after=40s 325m python -u runner.py
      - name: Save immutable snapshot and verify remote recovery
        id: save
        if: always() && steps.lease.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.DB_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: python state_store.py save-release --baseline state/restore-baseline.db
      - name: Preserve recovery files if release saving failed
        # A public code repository must never expose a private state repository.
        if: always() && steps.restore.outcome == 'success' && steps.save.outcome != 'success' && (github.event.repository.private || steps.restore.outputs.state_repo_private == 'false')
        uses: actions/upload-artifact@v4
        with:
          name: sniper-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            backups/*.zip
            sniper.db
            settings.json
          retention-days: 7
          if-no-files-found: error
      - name: Continue after a failed bot too, only if state is safely saved
        if: always() && !cancelled() && steps.save.outcome == 'success' && vars.SNIPER_CHAIN_ENABLED == 'true' && (github.event_name != 'workflow_dispatch' || inputs.continue_chain)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          sleep 30
          workflow_file="${GITHUB_WORKFLOW_REF%@*}"
          workflow_file="${workflow_file##*/}"
          for attempt in 1 2 3; do
            if gh workflow run "$workflow_file" --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"; then
              exit 0
            fi
            sleep 10
          done
          exit 1
