name: Kufar Sniper 3.6

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: kufar-sniper-v3-singleton
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 355

    steps:
      - name: Скачивание кода
        uses: actions/checkout@v4

      - name: Восстановление SQLite базы и настроек
        uses: actions/cache/restore@v4
        with:
          path: |
            sniper.db
            sniper.db-wal
            sniper.db-shm
            settings.json
          key: sniper-v3-db-${{ github.run_id }}
          restore-keys: |
            sniper-v3-db-

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Установка библиотек
        run: pip install requests rapidfuzz

      - name: Запуск Kufar Sniper 3.6
        id: run-sniper
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
          MAX_RUN_HOURS: '5.8'
        run: python -u sniper.py

      - name: Сохранение SQLite базы и настроек
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            sniper.db
            sniper.db-wal
            sniper.db-shm
            settings.json
          key: sniper-v3-db-${{ github.run_id }}

      - name: Автоперезапуск следующей смены без пауз
        if: steps.run-sniper.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          WF_FILE=$(basename "${GITHUB_WORKFLOW_REF%@*}")
          curl -sS -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/${WF_FILE}/dispatches" \
            -d "{\"ref\":\"${GITHUB_REF_NAME}\"}"
